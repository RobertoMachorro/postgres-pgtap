name: Docker

# Builds the standard image (Dockerfile) only when Dockerfile changes.

on:
  push:
    branches: [ "main" ]
    paths: [ "Dockerfile" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
    paths: [ "Dockerfile" ]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: Dockerfile
      cache-scope: standard
